<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Мои песни</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; background: #f5f5f5; color: #1c1c1e; }
    .song-item { background: white; border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .song-title { font-weight: 600; flex: 1; cursor: pointer; }
    .add-btn { display: block; margin: 20px auto; background: #007aff; color: white; border: none; padding: 14px 32px; border-radius: 12px; font-size: 17px; width: 100%; max-width: 300px; cursor: pointer; }
    .hidden { display: none !important; }
    form { background: white; padding: 20px; border-radius: 12px; margin-top: 20px; }
    input, textarea { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #d1d1d6; font-family: inherit; font-size: 16px; box-sizing: border-box; }
    textarea { height: 200px; resize: vertical; }
    .form-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: flex-end; }
    .form-actions button { padding: 10px 20px; border-radius: 10px; border: none; font-weight: 600; font-size: 16px; cursor: pointer; }
    .save-btn { background: #34c759; color: white; }
    .cancel-btn { background: #e5e5ea; }
    .lyrics-view { background: white; border-radius: 12px; padding: 20px; white-space: pre-wrap; font-size: 16px; line-height: 1.6; }
    .back-btn { color: #007aff; font-weight: 600; cursor: pointer; margin-bottom: 10px; background: none; border: none; font-size: 16px; }
  </style>
</head>
<body>
  <div id="mainScreen">
    <h1>🎤 Мои тексты</h1>
    <div id="songList"></div>
    <div id="emptyState" style="text-align:center;color:#8e8e93;margin-top:60px;" class="hidden">Пока нет ни одной песни</div>
    <button class="add-btn" onclick="showAddForm()">+ Добавить песню</button>
    <div id="formContainer" class="hidden">
      <form onsubmit="saveSong(event)">
        <input type="hidden" id="songIndex" value="-1">
        <label>Название песни</label>
        <input type="text" id="titleInput" placeholder="Введи название" required>
        <label>Текст песни</label>
        <textarea id="lyricsInput" placeholder="Вставь текст..." required></textarea>
        <div class="form-actions">
          <button type="button" class="cancel-btn" onclick="hideForm()">Отмена</button>
          <button type="submit" class="save-btn">Сохранить</button>
        </div>
      </form>
    </div>
  </div>
  <div id="viewScreen" class="hidden">
    <button class="back-btn" onclick="goBack()">← Назад</button>
    <h1 id="viewTitle"></h1>
    <div id="viewLyrics" class="lyrics-view"></div>
  </div>
  <script>
    const KEY = 'my_lyrics_songs';
    let songs = JSON.parse(localStorage.getItem(KEY) || '[]');
    function save() { localStorage.setItem(KEY, JSON.stringify(songs)); }
    function render() {
      const list = document.getElementById('songList');
      const empty = document.getElementById('emptyState');
      if (songs.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        list.innerHTML = songs.map((s, i) => 
          `<div class="song-item">
            <span class="song-title" onclick="viewSong(${i})">${s.title.replace(/</g,'&lt;')}</span>
            <div style="display:flex;gap:8px;">
              <button onclick="editSong(${i})" style="background:none;border:none;font-size:20px;cursor:pointer;">✏️</button>
              <button onclick="deleteSong(${i})" style="background:none;border:none;font-size:20px;cursor:pointer;">🗑️</button>
            </div>
          </div>`
        ).join('');
      }
    }
    function showAddForm() {
      document.getElementById('songIndex').value = '-1';
      document.getElementById('titleInput').value = '';
      document.getElementById('lyricsInput').value = '';
      document.getElementById('formContainer').classList.remove('hidden');
      document.querySelector('.add-btn').classList.add('hidden');
    }
    function hideForm() {
      document.getElementById('formContainer').classList.add('hidden');
      document.querySelector('.add-btn').classList.remove('hidden');
    }
    function editSong(i) {
      document.getElementById('songIndex').value = i;
      document.getElementById('titleInput').value = songs[i].title;
      document.getElementById('lyricsInput').value = songs[i].lyrics;
      document.getElementById('formContainer').classList.remove('hidden');
      document.querySelector('.add-btn').classList.add('hidden');
    }
    function saveSong(e) {
      e.preventDefault();
      const i = parseInt(document.getElementById('songIndex').value);
      const song = {
        title: document.getElementById('titleInput').value.trim(),
        lyrics: document.getElementById('lyricsInput').value.trim()
      };
      if (!song.title || !song.lyrics) return;
      i === -1 ? songs.push(song) : songs[i] = song;
      save(); render(); hideForm();
    }
    function deleteSong(i) {
      if (confirm('Удалить песню «' + songs[i].title + '»?')) {
        songs.splice(i, 1); save(); render();
      }
    }
    function viewSong(i) {
      document.getElementById('viewTitle').textContent = songs[i].title;
      document.getElementById('viewLyrics').textContent = songs[i].lyrics;
      document.getElementById('mainScreen').classList.add('hidden');
      document.getElementById('viewScreen').classList.remove('hidden');
      window.scrollTo(0,0);
    }
    function goBack() {
      document.getElementById('viewScreen').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
    }
    render();
  </script>
</body>
</html>
