<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>My Lyrics</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #1c1c1e;
      --card-bg: #2c2c2e;
      --text: #ffffff;
      --secondary: #8e8e93;
      --accent: #0a84ff;
      --save: #30d158;
      --cancel-bg: #3a3a3c;
      --border: #3a3a3c;
    }
    * { box-sizing: border-box; }
        body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top, 0px));
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    h1 { margin-top: 10px; font-size: 28px; text-align: center; }
    
    .song-item {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .song-title {
      font-weight: 600;
      flex: 1;
      cursor: pointer;
      font-size: 17px;
    }
    .song-title:active { opacity: 0.7; }
    
    .icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      color: var(--text);
    }
    .icon-btn:active { background: rgba(255,255,255,0.1); }
    
    .add-btn {
      display: block;
      margin: 20px auto;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      width: 100%;
      max-width: 300px;
      cursor: pointer;
    }
    .add-btn:active { opacity: 0.8; }
    
    .hidden { display: none !important; }
    
    form {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-top: 12px;
      font-size: 15px;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 16px;
      background: var(--bg);
      color: var(--text);
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea { height: 200px; resize: vertical; }
    
    .form-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .form-actions button {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
    }
    .save-btn { background: var(--save); color: white; }
    .cancel-btn { background: var(--cancel-bg); color: var(--text); }
    
    .empty-state {
      text-align: center;
      color: var(--secondary);
      margin-top: 60px;
      font-size: 16px;
    }
    
    /* View screen */
    .back-btn {
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      background: none;
      border: none;
      font-size: 16px;
      padding: 0;
    }
    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      margin-top: 16px;
    }
    
    .view-header h1 { margin: 0; font-size: 24px; text-align: left; flex: 1; }
    
    .zoom-controls {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .zoom-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-btn:active { background: var(--border); }
    
    .lyrics-view {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    
    /* Edit button on view screen */
    .edit-inline {
      color: var(--accent);
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      padding: 0;
    }
  </style>
</head>
<body>

  <!-- Main Screen -->
  <div id="mainScreen">
    <h1>🎤 My Lyrics</h1>
    <div id="songList"></div>
    <div id="emptyState" class="empty-state hidden">No songs yet</div>
    <button class="add-btn" onclick="showAddForm()">+ Add Song</button>
    
    <div id="formContainer" class="hidden">
      <form onsubmit="saveSong(event)">
        <input type="hidden" id="songIndex" value="-1">
        <label for="titleInput">Song Title</label>
        <input type="text" id="titleInput" placeholder="Enter title" required>
        <label for="lyricsInput">Lyrics</label>
        <textarea id="lyricsInput" placeholder="Paste lyrics..." required></textarea>
        <div class="form-actions">
          <button type="button" class="cancel-btn" onclick="hideForm()">Cancel</button>
          <button type="submit" class="save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- View Screen -->
  <div id="viewScreen" class="hidden">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div class="view-header">
      <h1 id="viewTitle"></h1>
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomOut()" title="Smaller">A−</button>
        <button class="zoom-btn" onclick="zoomIn()" title="Bigger">A+</button>
      </div>
    </div>
    <div id="viewLyrics" class="lyrics-view"></div>
    <button class="edit-inline" id="editFromViewBtn" onclick="editFromView()">✏️ Edit Lyrics</button>
  </div>

  <script>
    const KEY = 'my_lyrics_songs';
    let songs = JSON.parse(localStorage.getItem(KEY) || '[]');
    let currentViewIndex = -1;
    let currentZoom = 16; // base font size in px

    function save() { localStorage.setItem(KEY, JSON.stringify(songs)); }

    function render() {
      const list = document.getElementById('songList');
      const empty = document.getElementById('emptyState');
      if (songs.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        list.innerHTML = songs.map((s, i) => 
          `<div class="song-item">
            <span class="song-title" onclick="viewSong(${i})">${escapeHtml(s.title)}</span>
            <div style="display:flex;gap:4px;">
              <button class="icon-btn" onclick="editSong(${i})" title="Edit">✏️</button>
              <button class="icon-btn" onclick="deleteSong(${i})" title="Delete">🗑️</button>
            </div>
          </div>`
        ).join('');
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function showAddForm() {
      document.getElementById('songIndex').value = '-1';
      document.getElementById('titleInput').value = '';
      document.getElementById('lyricsInput').value = '';
      document.getElementById('formContainer').classList.remove('hidden');
      document.querySelector('.add-btn').classList.add('hidden');
      window.scrollTo(0, document.getElementById('formContainer').offsetTop - 20);
    }

    function hideForm() {
      document.getElementById('formContainer').classList.add('hidden');
      document.querySelector('.add-btn').classList.remove('hidden');
    }

    function editSong(i) {
      document.getElementById('songIndex').value = i;
      document.getElementById('titleInput').value = songs[i].title;
      document.getElementById('lyricsInput').value = songs[i].lyrics;
      document.getElementById('formContainer').classList.remove('hidden');
      document.querySelector('.add-btn').classList.add('hidden');
      window.scrollTo(0, document.getElementById('formContainer').offsetTop - 20);
    }

    function saveSong(e) {
      e.preventDefault();
      const i = parseInt(document.getElementById('songIndex').value);
      const title = document.getElementById('titleInput').value.trim();
      const lyrics = document.getElementById('lyricsInput').value.trim();
      if (!title || !lyrics) return;
      
      const song = { title, lyrics };
      if (i === -1) {
        songs.push(song);
      } else {
        songs[i] = song;
        // If we were editing the currently viewed song, update view
        if (currentViewIndex === i) {
          document.getElementById('viewTitle').textContent = title;
          document.getElementById('viewLyrics').textContent = lyrics;
          applyZoom();
        }
      }
      save();
      render();
      hideForm();
    }

    function deleteSong(i) {
      if (confirm('Delete "' + songs[i].title + '"?')) {
        if (currentViewIndex === i) goBack();
        songs.splice(i, 1);
        save();
        render();
      }
    }

    // View screen
    function viewSong(i) {
      currentViewIndex = i;
      document.getElementById('viewTitle').textContent = songs[i].title;
      document.getElementById('viewLyrics').textContent = songs[i].lyrics;
      document.getElementById('editFromViewBtn').onclick = function() { editFromView(); };
      currentZoom = 16;
      applyZoom();
      document.getElementById('mainScreen').classList.add('hidden');
      document.getElementById('viewScreen').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function goBack() {
      currentViewIndex = -1;
      document.getElementById('viewScreen').classList.add('hidden');
      document.getElementById('mainScreen').classList.remove('hidden');
      render(); // refresh list in case of edits
      window.scrollTo(0, 0);
    }

    function editFromView() {
      if (currentViewIndex === -1) return;
      goBack();
      setTimeout(() => editSong(currentViewIndex), 100);
    }

    // Zoom
    function zoomIn() {
      if (currentZoom < 32) currentZoom += 2;
      applyZoom();
    }

    function zoomOut() {
      if (currentZoom > 10) currentZoom -= 2;
      applyZoom();
    }

    function applyZoom() {
      document.getElementById('viewLyrics').style.fontSize = currentZoom + 'px';
    }

    render();
  </script>
</body>
</html>
